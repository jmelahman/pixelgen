[package]
name = "pixelgen-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser bindings for the pixelgen renderer"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pixelgen-core = { workspace = true }
wasm-bindgen = "0.2"
serde = { workspace = true }
serde_yaml = { workspace = true }
# Only for talking to the page: the layer panel sends edits and reads layers as
# JSON, which is what JavaScript parses natively.
serde_json = "1"

# Turns a Rust panic into a readable console trace instead of the bare
# "unreachable executed" that wasm otherwise reports.
console_error_panic_hook = "0.1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]
