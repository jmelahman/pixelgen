[workspace]
resolver = "2"
members = ["crates/pixelgen-core", "crates/pixelgen-cli", "crates/pixelgen-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/jmelahman/pixelgen"

[workspace.dependencies]
pixelgen-core = { path = "crates/pixelgen-core" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
gif = "0.14"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
